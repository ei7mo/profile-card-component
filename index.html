<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="bkground">
          <img src="images/bg-pattern-card.svg" alt="" />
        </div>
        <img class="avatar" src="images/image-victor.jpg" alt="avatar" />
        <p>Victor Crest <span>26</span></p>
        <span class="location">London</span>
        <div class="stats">
          <div class="followers">
            <h3>80K</h3>
            <span>Followers</span>
          </div>
          <div class="likes">
            <h3>803K</h3>
            <span>Likes</span>
          </div>
          <div class="photos">
            <h3>1.4K</h3>
            <span>Photos</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
